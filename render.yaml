services:
  - type: web
    name: scrs-backend
    runtime: node
    repo: https://github.com/Samuel-AKINGENEYE/Smart-Citizen-Service-Request-System
    plan: free
    branch: main
    buildCommand: cd backend && npm install
    startCommand: cd backend && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        sync: false
