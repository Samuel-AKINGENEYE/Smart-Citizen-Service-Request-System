<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>SCRS - Smart Citizen Request System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <style>
        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-center mb-8">Smart Citizen Request System</h1>
        
        <!-- Login Form -->
        <div id="loginPanel" class="max-w-md mx-auto bg-white rounded-lg shadow p-6">
            <h2 class="text-xl font-bold mb-4">Login</h2>
            <input type="email" id="email" placeholder="Email" class="w-full p-2 border rounded mb-3">
            <input type="password" id="password" placeholder="Password" class="w-full p-2 border rounded mb-3">
            <button onclick="login()" class="w-full bg-blue-500 text-white p-2 rounded">Login</button>
            <p class="text-center mt-3">No account? <a href="#" onclick="showRegister()" class="text-blue-500">Register</a></p>
        </div>
        
        <!-- Register Form -->
        <div id="registerPanel" class="max-w-md mx-auto bg-white rounded-lg shadow p-6 hidden">
            <h2 class="text-xl font-bold mb-4">Register</h2>
            <input type="text" id="regName" placeholder="Full Name" class="w-full p-2 border rounded mb-3">
            <input type="email" id="regEmail" placeholder="Email" class="w-full p-2 border rounded mb-3">
            <input type="text" id="regPhone" placeholder="Phone" class="w-full p-2 border rounded mb-3">
            <input type="password" id="regPassword" placeholder="Password" class="w-full p-2 border rounded mb-3">
            <button onclick="register()" class="w-full bg-green-500 text-white p-2 rounded">Register</button>
            <p class="text-center mt-3"><a href="#" onclick="showLogin()" class="text-blue-500">Back to Login</a></p>
        </div>
        
        <!-- Dashboard -->
        <div id="dashboard" class="hidden">
            <div class="bg-white rounded-lg shadow p-6 mb-4">
                <h2 id="welcomeMsg" class="text-xl font-bold"></h2>
                <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded mt-2">Logout</button>
            </div>
            
            <!-- Request Form -->
            <div class="bg-white rounded-lg shadow p-6 mb-4">
                <h3 class="text-lg font-bold mb-3">Submit Request</h3>
                <select id="category" class="w-full p-2 border rounded mb-3">
                    <option value="">Select Category</option>
                </select>
                <input type="text" id="title" placeholder="Title" class="w-full p-2 border rounded mb-3">
                <textarea id="description" placeholder="Description" rows="3" class="w-full p-2 border rounded mb-3"></textarea>
                <input type="text" id="location" placeholder="Location" class="w-full p-2 border rounded mb-3">
                <select id="priority" class="w-full p-2 border rounded mb-3">
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>
                <button onclick="submitRequest()" class="w-full bg-green-500 text-white p-2 rounded">Submit</button>
            </div>
            
            <!-- Requests List -->
            <div class="bg-white rounded-lg shadow p-6">
                <h3 class="text-lg font-bold mb-3">My Requests</h3>
                <div id="requestsList" class="space-y-2"></div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://scrs-backend.onrender.com/api';
        let token = localStorage.getItem('token');
        
        console.log('App loaded, API:', API_URL);
        
        if (token) {
            loadDashboard();
        } else {
            showLogin();
        }
        
        function showLogin() {
            document.getElementById('loginPanel').classList.remove('hidden');
            document.getElementById('registerPanel').classList.add('hidden');
            document.getElementById('dashboard').classList.add('hidden');
        }
        
        function showRegister() {
            document.getElementById('loginPanel').classList.add('hidden');
            document.getElementById('registerPanel').classList.remove('hidden');
            document.getElementById('dashboard').classList.add('hidden');
        }
        
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                const res = await axios.post(`${API_URL}/auth/login`, { email, password });
                if (res.data.success) {
                    localStorage.setItem('token', res.data.token);
                    localStorage.setItem('user', JSON.stringify(res.data.user));
                    token = res.data.token;
                    await loadDashboard();
                }
            } catch(err) {
                alert('Login failed: ' + (err.response?.data?.message || err.message));
            }
        }
        
        async function register() {
            const data = {
                full_name: document.getElementById('regName').value,
                email: document.getElementById('regEmail').value,
                phone: document.getElementById('regPhone').value,
                password: document.getElementById('regPassword').value,
                national_id: 'TEMP' + Date.now()
            };
            try {
                const res = await axios.post(`${API_URL}/auth/register`, data);
                if (res.data.success) {
                    alert('Registration successful! OTP: ' + res.data.otp);
                    showLogin();
                }
            } catch(err) {
                alert('Registration failed: ' + (err.response?.data?.message || err.message));
            }
        }
        
        async function loadDashboard() {
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            document.getElementById('welcomeMsg').innerHTML = `Welcome, ${user.full_name || 'User'}! Role: ${user.role || 'citizen'}`;
            document.getElementById('loginPanel').classList.add('hidden');
            document.getElementById('registerPanel').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            
            await loadCategories();
            await loadMyRequests();
        }
        
        async function loadCategories() {
            try {
                const res = await axios.get(`${API_URL}/categories`);
                const select = document.getElementById('category');
                select.innerHTML = '<option value="">Select Category</option>' + 
                    res.data.categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
            } catch(err) {
                console.error('Categories error:', err);
            }
        }
        
        async function submitRequest() {
            const token = localStorage.getItem('token');
            const data = {
                category_id: document.getElementById('category').value,
                title: document.getElementById('title').value,
                description: document.getElementById('description').value,
                location_address: document.getElementById('location').value,
                priority: document.getElementById('priority').value
            };
            try {
                const res = await axios.post(`${API_URL}/requests`, data, {
                    headers: { Authorization: `Bearer ${token}` }
                });
                if (res.data.success) {
                    alert('Request submitted! Ref: ' + res.data.reference_number);
                    document.getElementById('title').value = '';
                    document.getElementById('description').value = '';
                    document.getElementById('location').value = '';
                    await loadMyRequests();
                }
            } catch(err) {
                alert('Submit failed: ' + (err.response?.data?.message || err.message));
            }
        }
        
        async function loadMyRequests() {
            const token = localStorage.getItem('token');
            try {
                const res = await axios.get(`${API_URL}/requests/my-requests`, {
                    headers: { Authorization: `Bearer ${token}` }
                });
                const container = document.getElementById('requestsList');
                const requests = res.data.requests || [];
                if (requests.length === 0) {
                    container.innerHTML = '<p class="text-gray-500">No requests yet</p>';
                } else {
                    container.innerHTML = requests.map(r => `
                        <div class="border p-3 rounded">
                            <b>${r.title || 'Request'}</b><br>
                            <small>Status: ${r.status} | Priority: ${r.priority}</small><br>
                            <small class="text-gray-500">Ref: ${r.reference_number}</small>
                        </div>
                    `).join('');
                }
            } catch(err) {
                console.error('Load requests error:', err);
            }
        }
        
        function logout() {
            localStorage.clear();
            token = null;
            showLogin();
        }
    </script>
</body>
</html>
