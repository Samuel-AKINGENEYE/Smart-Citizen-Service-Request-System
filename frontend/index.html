<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Citizen Request System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .hidden { display: none; }
        .card-hover:hover { transform: translateY(-5px); transition: all 0.3s ease; }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="bg-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center space-x-2">
                    <i class="fas fa-city text-blue-600 text-2xl"></i>
                    <span class="font-bold text-xl text-gray-800">Smart Citizen</span>
                    <span class="text-sm bg-blue-100 text-blue-600 px-2 py-1 rounded">Request System</span>
                </div>
                <div id="nav-buttons" class="flex space-x-4">
                    <button onclick="showLogin()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">
                        <i class="fas fa-sign-in-alt mr-2"></i>Login
                    </button>
                    <button onclick="showRegister()" class="border-2 border-blue-600 text-blue-600 px-4 py-2 rounded-lg hover:bg-blue-50 transition">
                        <i class="fas fa-user-plus mr-2"></i>Register
                    </button>
                </div>
                <div id="user-info" class="hidden items-center space-x-4">
                    <div class="flex items-center space-x-2">
                        <i class="fas fa-user-circle text-gray-600 text-2xl"></i>
                        <span id="user-name" class="font-medium text-gray-700"></span>
                        <span id="user-role" class="text-xs bg-gray-200 px-2 py-1 rounded-full"></span>
                    </div>
                    <button onclick="logout()" class="text-red-600 hover:text-red-800">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mx-auto px-4 py-8">
        <!-- Login Form -->
        <div id="login-form" class="max-w-md mx-auto bg-white rounded-xl shadow-lg p-8">
            <h2 class="text-2xl font-bold mb-6 text-center">Welcome Back</h2>
            <form onsubmit="login(event)">
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">Email</label>
                    <input type="email" id="login-email" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">Password</label>
                    <input type="password" id="login-password" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">
                    Login
                </button>
            </form>
            <p class="text-center mt-4 text-gray-600">
                Don't have an account? <a href="#" onclick="showRegister()" class="text-blue-600">Register</a>
            </p>
        </div>

        <!-- Register Form -->
        <div id="register-form" class="max-w-md mx-auto bg-white rounded-xl shadow-lg p-8 hidden">
            <h2 class="text-2xl font-bold mb-6 text-center">Create Account</h2>
            <form onsubmit="register(event)">
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">Full Name</label>
                    <input type="text" id="reg-name" required class="w-full px-4 py-2 border rounded-lg">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">Email</label>
                    <input type="email" id="reg-email" required class="w-full px-4 py-2 border rounded-lg">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">Phone</label>
                    <input type="tel" id="reg-phone" required class="w-full px-4 py-2 border rounded-lg">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">Password</label>
                    <input type="password" id="reg-password" required class="w-full px-4 py-2 border rounded-lg">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">
                    Register
                </button>
            </form>
            <p class="text-center mt-4 text-gray-600">
                Already have an account? <a href="#" onclick="showLogin()" class="text-blue-600">Login</a>
            </p>
        </div>

        <!-- Citizen Dashboard -->
        <div id="citizen-dashboard" class="hidden">
            <div class="grid lg:grid-cols-3 gap-6">
                <div class="lg:col-span-1">
                    <div class="bg-white rounded-xl shadow-lg p-6">
                        <h3 class="text-xl font-bold mb-4">Submit New Request</h3>
                        <form onsubmit="submitRequest(event)">
                            <div class="mb-4">
                                <label class="block text-gray-700 mb-2">Category</label>
                                <select id="req-category" required class="w-full px-4 py-2 border rounded-lg">
                                    <option value="">Select Category</option>
                                </select>
                            </div>
                            <div class="mb-4">
                                <label class="block text-gray-700 mb-2">Title</label>
                                <input type="text" id="req-title" required class="w-full px-4 py-2 border rounded-lg">
                            </div>
                            <div class="mb-4">
                                <label class="block text-gray-700 mb-2">Description</label>
                                <textarea id="req-description" rows="3" required class="w-full px-4 py-2 border rounded-lg"></textarea>
                            </div>
                            <div class="mb-4">
                                <label class="block text-gray-700 mb-2">Location</label>
                                <input type="text" id="req-location" placeholder="Address" class="w-full px-4 py-2 border rounded-lg">
                            </div>
                            <div class="mb-4">
                                <label class="block text-gray-700 mb-2">Priority</label>
                                <select id="req-priority" class="w-full px-4 py-2 border rounded-lg">
                                    <option value="low">Low</option>
                                    <option value="medium" selected>Medium</option>
                                    <option value="high">High</option>
                                    <option value="urgent">Urgent</option>
                                </select>
                            </div>
                            <div class="mb-4">
                                <label class="block text-gray-700 mb-2">Photos (up to 5 files)</label>
                                <input type="file" id="req-photos" accept="image/*" multiple class="w-full px-4 py-2 border rounded-lg">
                                <div id="image-preview" class="mt-2 flex flex-wrap gap-2"></div>
                            </div>
                            <button type="submit" class="w-full bg-green-600 text-white py-2 rounded-lg hover:bg-green-700 transition">
                                Submit Request
                            </button>
                        </form>
                    </div>
                </div>
                <div class="lg:col-span-2">
                    <div class="bg-white rounded-xl shadow-lg p-6">
                        <h3 class="text-xl font-bold mb-4">My Requests</h3>
                        <div id="requests-list" class="space-y-4 max-h-96 overflow-y-auto">
                            <p class="text-gray-500 text-center">No requests yet</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Admin Dashboard -->
        <div id="admin-dashboard" class="hidden">
            <div class="grid lg:grid-cols-4 gap-6 mb-8">
                <div class="bg-gradient-to-r from-blue-500 to-blue-600 rounded-xl shadow-lg p-6 text-white">
                    <i class="fas fa-tasks text-3xl mb-2"></i>
                    <h4 class="text-sm opacity-90">Total Requests</h4>
                    <p id="total-requests" class="text-3xl font-bold">0</p>
                </div>
                <div class="bg-gradient-to-r from-yellow-500 to-yellow-600 rounded-xl shadow-lg p-6 text-white">
                    <i class="fas fa-clock text-3xl mb-2"></i>
                    <h4 class="text-sm opacity-90">Open</h4>
                    <p id="open-requests" class="text-3xl font-bold">0</p>
                </div>
                <div class="bg-gradient-to-r from-purple-500 to-purple-600 rounded-xl shadow-lg p-6 text-white">
                    <i class="fas fa-spinner text-3xl mb-2"></i>
                    <h4 class="text-sm opacity-90">In Progress</h4>
                    <p id="progress-requests" class="text-3xl font-bold">0</p>
                </div>
                <div class="bg-gradient-to-r from-green-500 to-green-600 rounded-xl shadow-lg p-6 text-white">
                    <i class="fas fa-check-circle text-3xl mb-2"></i>
                    <h4 class="text-sm opacity-90">Resolved</h4>
                    <p id="resolved-requests" class="text-3xl font-bold">0</p>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-lg p-6">
                <h3 class="text-xl font-bold mb-4">All Requests</h3>
                <div id="admin-requests-list" class="overflow-x-auto">
                    <p class="text-gray-500 text-center">Loading requests...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // API Configuration
        const API_URL = 'https://scrs-backend.onrender.com/api';
        console.log('🌐 API URL:', API_URL);
    </script>
    <script src="js/app.js"></script>
</body>
</html>
