<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Citizen Request System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .hidden { display: none !important; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center gap-2">
                    <i class="fas fa-city text-blue-600 text-2xl"></i>
                    <span class="font-bold text-xl">Smart Citizen Request System</span>
                </div>
                <div id="nav-buttons">
                    <button onclick="showLogin()" class="bg-blue-600 text-white px-4 py-2 rounded-lg">Login</button>
                    <button onclick="showRegister()" class="border-2 border-blue-600 text-blue-600 px-4 py-2 rounded-lg">Register</button>
                </div>
                <div id="user-info" class="hidden items-center gap-4">
                    <span id="user-name" class="font-medium"></span>
                    <span id="user-role" class="text-xs bg-gray-200 px-2 py-1 rounded"></span>
                    <button onclick="logout()" class="text-red-600">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mx-auto px-4 py-8">
        <!-- Login Form -->
        <div id="login-form" class="max-w-md mx-auto bg-white rounded-xl shadow-lg p-8">
            <h2 class="text-2xl font-bold mb-6 text-center">Login</h2>
            <form onsubmit="login(event)">
                <input type="email" id="login-email" placeholder="Email" class="w-full p-3 border rounded-lg mb-4" required>
                <input type="password" id="login-password" placeholder="Password" class="w-full p-3 border rounded-lg mb-4" required>
                <button type="submit" class="w-full bg-blue-600 text-white p-3 rounded-lg">Login</button>
            </form>
            <p class="text-center mt-4">No account? <a href="#" onclick="showRegister()" class="text-blue-600">Register</a></p>
        </div>

        <!-- Register Form -->
        <div id="register-form" class="max-w-md mx-auto bg-white rounded-xl shadow-lg p-8 hidden">
            <h2 class="text-2xl font-bold mb-6 text-center">Register</h2>
            <form onsubmit="register(event)">
                <input type="text" id="reg-name" placeholder="Full Name" class="w-full p-3 border rounded-lg mb-4" required>
                <input type="email" id="reg-email" placeholder="Email" class="w-full p-3 border rounded-lg mb-4" required>
                <input type="tel" id="reg-phone" placeholder="Phone" class="w-full p-3 border rounded-lg mb-4" required>
                <input type="password" id="reg-password" placeholder="Password" class="w-full p-3 border rounded-lg mb-4" required>
                <button type="submit" class="w-full bg-blue-600 text-white p-3 rounded-lg">Register</button>
            </form>
            <p class="text-center mt-4">Have an account? <a href="#" onclick="showLogin()" class="text-blue-600">Login</a></p>
        </div>

        <!-- Citizen Dashboard -->
        <div id="citizen-dashboard" class="hidden">
            <div class="grid md:grid-cols-3 gap-6">
                <div class="bg-white rounded-xl shadow-lg p-6">
                    <h3 class="text-xl font-bold mb-4">Submit Request</h3>
                    <form onsubmit="submitRequest(event)">
                        <select id="req-category" class="w-full p-3 border rounded-lg mb-4" required>
                            <option value="">Select Category</option>
                        </select>
                        <input type="text" id="req-title" placeholder="Title" class="w-full p-3 border rounded-lg mb-4" required>
                        <textarea id="req-description" placeholder="Description" rows="3" class="w-full p-3 border rounded-lg mb-4" required></textarea>
                        <input type="text" id="req-location" placeholder="Location" class="w-full p-3 border rounded-lg mb-4">
                        <select id="req-priority" class="w-full p-3 border rounded-lg mb-4">
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                            <option value="urgent">Urgent</option>
                        </select>
                        <input type="file" id="req-photos" accept="image/*" multiple class="w-full p-3 border rounded-lg mb-4">
                        <div id="image-preview" class="flex gap-2 mb-4"></div>
                        <button type="submit" class="w-full bg-green-600 text-white p-3 rounded-lg">Submit</button>
                    </form>
                </div>
                <div class="md:col-span-2 bg-white rounded-xl shadow-lg p-6">
                    <h3 class="text-xl font-bold mb-4">My Requests</h3>
                    <div id="requests-list" class="space-y-4 max-h-96 overflow-y-auto"></div>
                </div>
            </div>
        </div>

        <!-- Admin Dashboard -->
        <div id="admin-dashboard" class="hidden">
            <div class="grid md:grid-cols-4 gap-6 mb-8">
                <div class="bg-blue-600 text-white rounded-xl p-6"><h4>Total</h4><p id="total-requests" class="text-3xl font-bold">0</p></div>
                <div class="bg-yellow-600 text-white rounded-xl p-6"><h4>Open</h4><p id="open-requests" class="text-3xl font-bold">0</p></div>
                <div class="bg-purple-600 text-white rounded-xl p-6"><h4>In Progress</h4><p id="progress-requests" class="text-3xl font-bold">0</p></div>
                <div class="bg-green-600 text-white rounded-xl p-6"><h4>Resolved</h4><p id="resolved-requests" class="text-3xl font-bold">0</p></div>
            </div>
            <div class="bg-white rounded-xl shadow-lg p-6">
                <h3 class="text-xl font-bold mb-4">All Requests</h3>
                <div id="admin-requests-list" class="overflow-x-auto"></div>
            </div>
        </div>
    </div>

    <script>
        // Production API URL
        const API_URL = 'https://scrs-backend.onrender.com/api';
        console.log('API URL:', API_URL);
        console.log('Frontend version: 2.0 - Login Dashboard');
    </script>
    <script src="js/app.js"></script>
</body>
</html>
