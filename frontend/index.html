<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Citizen Request System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <style>
        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-500 to-purple-600 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <!-- Login Card -->
        <div id="loginCard" class="max-w-md mx-auto bg-white rounded-2xl shadow-2xl p-8">
            <h1 class="text-3xl font-bold text-center mb-2">Smart Citizen</h1>
            <p class="text-center text-gray-600 mb-8">Request System</p>
            
            <form onsubmit="handleLogin(event)">
                <input type="email" id="loginEmail" placeholder="Email" class="w-full p-3 border rounded-lg mb-4" required>
                <input type="password" id="loginPassword" placeholder="Password" class="w-full p-3 border rounded-lg mb-4" required>
                <button type="submit" class="w-full bg-blue-600 text-white p-3 rounded-lg font-semibold hover:bg-blue-700">Login</button>
            </form>
            <p class="text-center mt-4 text-gray-600">
                No account? <a href="#" onclick="showRegister()" class="text-blue-600 font-semibold">Register</a>
            </p>
        </div>

        <!-- Register Card -->
        <div id="registerCard" class="max-w-md mx-auto bg-white rounded-2xl shadow-2xl p-8 hidden">
            <h2 class="text-2xl font-bold text-center mb-6">Create Account</h2>
            <form onsubmit="handleRegister(event)">
                <input type="text" id="regName" placeholder="Full Name" class="w-full p-3 border rounded-lg mb-4" required>
                <input type="email" id="regEmail" placeholder="Email" class="w-full p-3 border rounded-lg mb-4" required>
                <input type="tel" id="regPhone" placeholder="Phone Number" class="w-full p-3 border rounded-lg mb-4" required>
                <input type="password" id="regPassword" placeholder="Password" class="w-full p-3 border rounded-lg mb-4" required>
                <button type="submit" class="w-full bg-green-600 text-white p-3 rounded-lg font-semibold hover:bg-green-700">Register</button>
            </form>
            <p class="text-center mt-4">
                <a href="#" onclick="showLogin()" class="text-blue-600">Back to Login</a>
            </p>
        </div>

        <!-- Citizen Dashboard -->
        <div id="citizenDashboard" class="hidden">
            <div class="bg-white rounded-2xl shadow-2xl p-6 mb-6">
                <div class="flex justify-between items-center">
                    <div>
                        <h2 class="text-2xl font-bold">Welcome, <span id="userName"></span>!</h2>
                        <p class="text-gray-600">Role: <span id="userRole"></span></p>
                    </div>
                    <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600">Logout</button>
                </div>
            </div>
            
            <div class="grid md:grid-cols-2 gap-6">
                <!-- Submit Request Form -->
                <div class="bg-white rounded-2xl shadow-2xl p-6">
                    <h3 class="text-xl font-bold mb-4">Submit New Request</h3>
                    <form onsubmit="submitRequest(event)">
                        <select id="reqCategory" class="w-full p-3 border rounded-lg mb-4" required>
                            <option value="">Select Category</option>
                        </select>
                        <input type="text" id="reqTitle" placeholder="Title" class="w-full p-3 border rounded-lg mb-4" required>
                        <textarea id="reqDescription" placeholder="Description" rows="3" class="w-full p-3 border rounded-lg mb-4" required></textarea>
                        <input type="text" id="reqLocation" placeholder="Location (optional)" class="w-full p-3 border rounded-lg mb-4">
                        <select id="reqPriority" class="w-full p-3 border rounded-lg mb-4">
                            <option value="low">Low Priority</option>
                            <option value="medium" selected>Medium Priority</option>
                            <option value="high">High Priority</option>
                            <option value="urgent">Urgent</option>
                        </select>
                        <button type="submit" class="w-full bg-green-600 text-white p-3 rounded-lg font-semibold hover:bg-green-700">Submit Request</button>
                    </form>
                </div>
                
                <!-- My Requests List -->
                <div class="bg-white rounded-2xl shadow-2xl p-6">
                    <h3 class="text-xl font-bold mb-4">My Requests</h3>
                    <div id="requestsList" class="space-y-3 max-h-96 overflow-y-auto"></div>
                </div>
            </div>
        </div>

        <!-- Admin Dashboard -->
        <div id="adminDashboard" class="hidden">
            <div class="bg-white rounded-2xl shadow-2xl p-6 mb-6">
                <div class="flex justify-between items-center">
                    <div>
                        <h2 class="text-2xl font-bold">Admin Dashboard</h2>
                        <p class="text-gray-600">Welcome, <span id="adminName"></span></p>
                    </div>
                    <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600">Logout</button>
                </div>
            </div>
            
            <!-- Stats -->
            <div class="grid md:grid-cols-4 gap-4 mb-6">
                <div class="bg-blue-500 text-white rounded-xl p-4">
                    <p class="text-sm">Total Requests</p>
                    <p id="statTotal" class="text-3xl font-bold">0</p>
                </div>
                <div class="bg-yellow-500 text-white rounded-xl p-4">
                    <p class="text-sm">Open</p>
                    <p id="statOpen" class="text-3xl font-bold">0</p>
                </div>
                <div class="bg-purple-500 text-white rounded-xl p-4">
                    <p class="text-sm">In Progress</p>
                    <p id="statProgress" class="text-3xl font-bold">0</p>
                </div>
                <div class="bg-green-500 text-white rounded-xl p-4">
                    <p class="text-sm">Resolved</p>
                    <p id="statResolved" class="text-3xl font-bold">0</p>
                </div>
            </div>
            
            <!-- All Requests Table -->
            <div class="bg-white rounded-2xl shadow-2xl p-6 overflow-x-auto">
                <h3 class="text-xl font-bold mb-4">All Citizen Requests</h3>
                <div id="adminRequestsList"></div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://scrs-backend.onrender.com/api';
        let authToken = localStorage.getItem('token');
        let currentUser = null;

        console.log('🚀 App starting...');
        console.log('API_URL:', API_URL);

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            if (authToken) {
                loadUser();
            }
            loadCategories();
        });

        async function loadCategories() {
            try {
                const res = await axios.get(`${API_URL}/categories`);
                const select = document.getElementById('reqCategory');
                if (select) {
                    select.innerHTML = '<option value="">Select Category</option>' +
                        res.data.categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
                }
            } catch (err) {
                console.error('Categories error:', err);
            }
        }

        async function loadUser() {
            try {
                const user = JSON.parse(localStorage.getItem('user') || '{}');
                currentUser = user;
                
                if (user.role === 'super_admin' || user.role === 'department_admin') {
                    document.getElementById('adminDashboard').classList.remove('hidden');
                    document.getElementById('citizenDashboard').classList.add('hidden');
                    document.getElementById('loginCard').classList.add('hidden');
                    document.getElementById('registerCard').classList.add('hidden');
                    document.getElementById('adminName').textContent = user.full_name;
                    loadAdminStats();
                    loadAllRequests();
                } else {
                    document.getElementById('citizenDashboard').classList.remove('hidden');
                    document.getElementById('adminDashboard').classList.add('hidden');
                    document.getElementById('loginCard').classList.add('hidden');
                    document.getElementById('registerCard').classList.add('hidden');
                    document.getElementById('userName').textContent = user.full_name;
                    document.getElementById('userRole').textContent = user.role;
                    loadMyRequests();
                }
            } catch (err) {
                console.error('Load user error:', err);
                showLogin();
            }
        }

        function showLogin() {
            document.getElementById('loginCard').classList.remove('hidden');
            document.getElementById('registerCard').classList.add('hidden');
            document.getElementById('citizenDashboard').classList.add('hidden');
            document.getElementById('adminDashboard').classList.add('hidden');
        }

        function showRegister() {
            document.getElementById('loginCard').classList.add('hidden');
            document.getElementById('registerCard').classList.remove('hidden');
            document.getElementById('citizenDashboard').classList.add('hidden');
            document.getElementById('adminDashboard').classList.add('hidden');
        }

        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            try {
                const res = await axios.post(`${API_URL}/auth/login`, { email, password });
                if (res.data.success) {
                    localStorage.setItem('token', res.data.token);
                    localStorage.setItem('user', JSON.stringify(res.data.user));
                    authToken = res.data.token;
                    currentUser = res.data.user;
                    await loadUser();
                }
            } catch (err) {
                alert('Login failed: ' + (err.response?.data?.message || err.message));
            }
        }

        async function handleRegister(event) {
            event.preventDefault();
            const data = {
                full_name: document.getElementById('regName').value,
                email: document.getElementById('regEmail').value,
                phone: document.getElementById('regPhone').value,
                password: document.getElementById('regPassword').value,
                national_id: 'TEMP' + Date.now()
            };
            
            try {
                const res = await axios.post(`${API_URL}/auth/register`, data);
                if (res.data.success) {
                    alert('Registration successful! Your OTP: ' + res.data.otp + '\nPlease verify your account before logging in.');
                    showLogin();
                }
            } catch (err) {
                alert('Registration failed: ' + (err.response?.data?.message || err.message));
            }
        }

        async function submitRequest(event) {
            event.preventDefault();
            const data = {
                category_id: document.getElementById('reqCategory').value,
                title: document.getElementById('reqTitle').value,
                description: document.getElementById('reqDescription').value,
                location_address: document.getElementById('reqLocation').value,
                priority: document.getElementById('reqPriority').value
            };
            
            try {
                const res = await axios.post(`${API_URL}/requests`, data, {
                    headers: { Authorization: `Bearer ${authToken}` }
                });
                if (res.data.success) {
                    alert('Request submitted! Reference: ' + res.data.reference_number);
                    document.getElementById('reqTitle').value = '';
                    document.getElementById('reqDescription').value = '';
                    document.getElementById('reqLocation').value = '';
                    loadMyRequests();
                }
            } catch (err) {
                alert('Failed to submit: ' + (err.response?.data?.message || err.message));
            }
        }

        async function loadMyRequests() {
            try {
                const res = await axios.get(`${API_URL}/requests/my-requests`, {
                    headers: { Authorization: `Bearer ${authToken}` }
                });
                const requests = res.data.requests;
                const container = document.getElementById('requestsList');
                
                if (!requests || requests.length === 0) {
                    container.innerHTML = '<p class="text-gray-500 text-center">No requests yet</p>';
                    return;
                }
                
                container.innerHTML = requests.map(req => `
                    <div class="border rounded-lg p-3">
                        <div class="flex justify-between items-start">
                            <div>
                                <p class="font-semibold">${req.title || 'Request'}</p>
                                <p class="text-sm text-gray-600">${req.description?.substring(0, 80)}</p>
                                <div class="flex gap-2 mt-2">
                                    <span class="text-xs px-2 py-1 rounded ${req.status === 'open' ? 'bg-yellow-200' : req.status === 'resolved' ? 'bg-green-200' : 'bg-blue-200'}">${req.status}</span>
                                    <span class="text-xs px-2 py-1 rounded bg-gray-200">${req.priority}</span>
                                </div>
                                <p class="text-xs text-gray-500 mt-1">Ref: ${req.reference_number}</p>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error('Load requests error:', err);
            }
        }

        async function loadAdminStats() {
            try {
                const res = await axios.get(`${API_URL}/admin/stats`, {
                    headers: { Authorization: `Bearer ${authToken}` }
                });
                const stats = res.data.stats;
                document.getElementById('statTotal').textContent = stats.total || 0;
                document.getElementById('statOpen').textContent = stats.open || 0;
                document.getElementById('statProgress').textContent = stats.inProgress || 0;
                document.getElementById('statResolved').textContent = stats.resolved || 0;
            } catch (err) {
                console.error('Stats error:', err);
            }
        }

        async function loadAllRequests() {
            try {
                const res = await axios.get(`${API_URL}/admin/requests`, {
                    headers: { Authorization: `Bearer ${authToken}` }
                });
                const requests = res.data.requests;
                const container = document.getElementById('adminRequestsList');
                
                if (!requests || requests.length === 0) {
                    container.innerHTML = '<p class="text-center text-gray-500">No requests found</p>';
                    return;
                }
                
                container.innerHTML = `
                    <table class="w-full">
                        <thead class="bg-gray-100">
                            <tr>
                                <th class="p-2 text-left">Ref</th>
                                <th class="p-2 text-left">Citizen</th>
                                <th class="p-2 text-left">Title</th>
                                <th class="p-2 text-left">Status</th>
                                <th class="p-2 text-left">Priority</th>
                                <th class="p-2 text-left">Date</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${requests.map(req => `
                                <tr class="border-t">
                                    <td class="p-2">${req.reference_number}</td>
                                    <td class="p-2">${req.citizen_name}</td>
                                    <td class="p-2">${req.title || '-'}</td>
                                    <td class="p-2">
                                        <select onchange="updateStatus(${req.id}, this.value)" class="border rounded p-1">
                                            <option value="open" ${req.status === 'open' ? 'selected' : ''}>Open</option>
                                            <option value="in_progress" ${req.status === 'in_progress' ? 'selected' : ''}>In Progress</option>
                                            <option value="resolved" ${req.status === 'resolved' ? 'selected' : ''}>Resolved</option>
                                            <option value="rejected" ${req.status === 'rejected' ? 'selected' : ''}>Rejected</option>
                                        </select>
                                    </td>
                                    <td class="p-2">${req.priority}</td>
                                    <td class="p-2">${new Date(req.created_at).toLocaleDateString()}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            } catch (err) {
                console.error('Admin requests error:', err);
            }
        }

        window.updateStatus = async function(id, status) {
            try {
                await axios.put(`${API_URL}/admin/requests/${id}/status`, { status }, {
                    headers: { Authorization: `Bearer ${authToken}` }
                });
                alert('Status updated!');
                loadAllRequests();
                loadAdminStats();
            } catch (err) {
                alert('Failed to update status');
            }
        };

        function logout() {
            localStorage.clear();
            authToken = null;
            currentUser = null;
            showLogin();
        }

        window.showLogin = showLogin;
        window.showRegister = showRegister;
    </script>
</body>
</html>
