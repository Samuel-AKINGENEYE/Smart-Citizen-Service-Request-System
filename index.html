<!DOCTYPE html>
<html>
<head>
    <title>Smart Citizen Request System</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
</head>
<body class="bg-gradient-to-br from-blue-500 to-purple-600 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        
        <!-- LOGIN SECTION -->
        <div id="loginSection" class="max-w-md mx-auto bg-white rounded-2xl shadow-2xl p-8">
            <h1 class="text-3xl font-bold text-center mb-2">Smart Citizen</h1>
            <p class="text-center text-gray-600 mb-8">Request System</p>
            <div id="loginMsg" class="text-red-600 text-center mb-4 hidden"></div>
            <input type="email" id="email" placeholder="Email" class="w-full p-3 border rounded-lg mb-4">
            <input type="password" id="password" placeholder="Password" class="w-full p-3 border rounded-lg mb-4">
            <button onclick="login()" class="w-full bg-blue-600 text-white p-3 rounded-lg font-semibold">Login</button>
            <p class="text-center mt-4 text-gray-600">Demo: citizen@test.com / Citizen@123</p>
            <p class="text-center text-sm text-gray-500">Or register with any email (OTP: 123456)</p>
        </div>

        <!-- DASHBOARD SECTION -->
        <div id="dashboardSection" class="hidden">
            <div class="bg-white rounded-2xl shadow-2xl p-6 mb-6">
                <div class="flex justify-between items-center">
                    <div>
                        <h2 class="text-2xl font-bold">Welcome, <span id="userFullName"></span>!</h2>
                        <p>Role: <span id="userRole"></span></p>
                    </div>
                    <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded-lg">Logout</button>
                </div>
            </div>
            
            <div class="bg-white rounded-2xl shadow-2xl p-6 mb-6">
                <h3 class="text-xl font-bold mb-4">Submit New Request</h3>
                <div id="submitMsg" class="text-green-600 mb-4 hidden"></div>
                <input type="text" id="title" placeholder="Title" class="w-full p-3 border rounded-lg mb-4">
                <textarea id="description" placeholder="Description" rows="3" class="w-full p-3 border rounded-lg mb-4"></textarea>
                <select id="priority" class="w-full p-3 border rounded-lg mb-4">
                    <option value="low">Low Priority</option>
                    <option value="medium" selected>Medium Priority</option>
                    <option value="high">High Priority</option>
                    <option value="urgent">Urgent</option>
                </select>
                <button onclick="submitRequest()" class="w-full bg-green-600 text-white p-3 rounded-lg font-semibold">Submit Request</button>
            </div>
            
            <div class="bg-white rounded-2xl shadow-2xl p-6">
                <h3 class="text-xl font-bold mb-4">My Requests</h3>
                <div id="requestsList" class="space-y-2"></div>
            </div>
        </div>
    </div>

    <script>
        // Backend API URL
        const API_URL = 'https://scrs-api.onrender.com/api';
        console.log('🔗 API URL:', API_URL);
        
        let token = localStorage.getItem('token');
        
        // Check if user is already logged in
        if (token) {
            checkToken();
        }
        
        // Login function
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (!email || !password) {
                showMessage('loginMsg', 'Please enter email and password');
                return;
            }
            
            try {
                console.log('Logging in with:', email);
                const res = await axios.post(API_URL + '/auth/login', { email, password });
                console.log('Login response:', res.data);
                
                if (res.data.success) {
                    localStorage.setItem('token', res.data.token);
                    localStorage.setItem('user', JSON.stringify(res.data.user));
                    token = res.data.token;
                    showDashboard(res.data.user);
                }
            } catch (err) {
                console.error('Login error:', err);
                const msg = err.response?.data?.message || 'Login failed. Please check your credentials.';
                showMessage('loginMsg', msg);
            }
        }
        
        // Check token validity
        async function checkToken() {
            try {
                const user = JSON.parse(localStorage.getItem('user') || '{}');
                if (user.email) {
                    showDashboard(user);
                } else {
                    logout();
                }
            } catch (err) {
                logout();
            }
        }
        
        // Show dashboard
        function showDashboard(user) {
            console.log('Showing dashboard for:', user);
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('dashboardSection').classList.remove('hidden');
            document.getElementById('userFullName').innerText = user.full_name || user.email;
            document.getElementById('userRole').innerText = user.role || 'citizen';
            loadRequests();
        }
        
        // Submit a request
        async function submitRequest() {
            const title = document.getElementById('title').value;
            const description = document.getElementById('description').value;
            const priority = document.getElementById('priority').value;
            
            if (!title || !description) {
                alert('Please fill title and description');
                return;
            }
            
            const data = {
                category_id: 1,
                title: title,
                description: description,
                priority: priority,
                location_address: ''
            };
            
            try {
                console.log('Submitting request:', data);
                const res = await axios.post(API_URL + '/requests', data, {
                    headers: { Authorization: `Bearer ${token}` }
                });
                console.log('Submit response:', res.data);
                
                if (res.data.success) {
                    showMessage('submitMsg', '✅ Request submitted! Ref: ' + res.data.reference_number);
                    document.getElementById('title').value = '';
                    document.getElementById('description').value = '';
                    loadRequests();
                }
            } catch (err) {
                console.error('Submit error:', err);
                alert('Error: ' + (err.response?.data?.message || err.message));
            }
        }
        
        // Load user's requests
        async function loadRequests() {
            try {
                console.log('Loading requests...');
                const res = await axios.get(API_URL + '/requests/my-requests', {
                    headers: { Authorization: `Bearer ${token}` }
                });
                console.log('Requests response:', res.data);
                
                const requests = res.data.requests || [];
                const container = document.getElementById('requestsList');
                
                if (requests.length === 0) {
                    container.innerHTML = '<p class="text-gray-500 text-center py-4">No requests yet. Submit your first request above!</p>';
                } else {
                    container.innerHTML = requests.map(r => `
                        <div class="border rounded-lg p-3 hover:shadow transition">
                            <div class="flex justify-between items-start">
                                <div class="flex-1">
                                    <p class="font-bold">${escapeHtml(r.title)}</p>
                                    <p class="text-sm text-gray-600">${escapeHtml((r.description || '').substring(0, 100))}</p>
                                    <div class="flex gap-2 mt-2">
                                        <span class="text-xs px-2 py-1 rounded ${getStatusClass(r.status)}">${r.status || 'open'}</span>
                                        <span class="text-xs px-2 py-1 rounded bg-gray-200">${r.priority || 'medium'}</span>
                                    </div>
                                    <p class="text-xs text-gray-500 mt-1">Ref: ${r.reference_number}</p>
                                </div>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (err) {
                console.error('Load requests error:', err);
                document.getElementById('requestsList').innerHTML = '<p class="text-red-500 text-center">Error loading requests. Please try refreshing.</p>';
            }
        }
        
        // Helper functions
        function showMessage(elementId, message) {
            const el = document.getElementById(elementId);
            el.innerText = message;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 3000);
        }
        
        function getStatusClass(status) {
            switch(status) {
                case 'open': return 'bg-yellow-200 text-yellow-800';
                case 'in_progress': return 'bg-blue-200 text-blue-800';
                case 'resolved': return 'bg-green-200 text-green-800';
                default: return 'bg-gray-200';
            }
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function logout() {
            localStorage.clear();
            token = null;
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('dashboardSection').classList.add('hidden');
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
            console.log('Logged out');
        }
        
        console.log('✅ Frontend loaded. Ready to connect to:', API_URL);
        
        // Test backend connection
        async function testBackend() {
            try {
                const res = await axios.get(API_URL.replace('/api', '/health'));
                console.log('✅ Backend health:', res.data);
            } catch (err) {
                console.error('❌ Backend connection failed:', err.message);
            }
        }
        testBackend();
    </script>
</body>
</html>
